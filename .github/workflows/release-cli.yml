name: Release CLI

on:
  push:
    tags:
      - "gl-bws-cli-v*"

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Create GitHub release (linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "${TAG}" =~ ^gl-bws-cli-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected tag ${TAG}." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#gl-bws-cli-v}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Resolve build run id
        id: build-run
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          api="https://api.github.com/repos/${GH_REPO}/actions/workflows/build-cli.yml/runs?event=push&status=completed&per_page=50"
          run_id=""
          for _ in $(seq 1 20); do
            resp="$(curl -sS -H \"Authorization: Bearer ${GH_TOKEN}\" -H \"Accept: application/vnd.github+json\" \"${api}\")"
            run_id="$(python3 -c $'import json,os,sys\nsha=os.environ[\"TARGET_SHA\"]\ndata=json.loads(sys.stdin.read())\nrun=next((r for r in data.get(\"workflow_runs\",[]) if r.get(\"head_sha\")==sha and r.get(\"conclusion\")==\"success\"), None)\nprint(run[\"id\"] if run else \"\")' <<<\"${resp}\")"
            if [ -n "${run_id}" ]; then
              break
            fi
            sleep 15
          done
          if [ -z "${run_id}" ]; then
            echo "No successful Build CLI run found for ${TARGET_SHA}." >&2
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bws-x86_64-unknown-linux-gnu-${{ steps.tag.outputs.version }}
          path: packages
          run-id: ${{ steps.build-run.outputs.run_id }}
          repository: ${{ github.repository }}

      - name: Verify artifacts
        run: |
          ls -la packages
          test -f "packages/bws-x86_64-unknown-linux-gnu-${{ steps.tag.outputs.version }}.tar.gz"
          test -f "packages/bws-sha256-checksums-${{ steps.tag.outputs.version }}.txt"

      - name: Create GitHub release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          artifacts: packages/bws-x86_64-unknown-linux-gnu-${{ steps.tag.outputs.version }}.tar.gz,packages/bws-sha256-checksums-${{ steps.tag.outputs.version }}.txt
          tag: ${{ steps.tag.outputs.tag }}
          name: bws CLI v${{ steps.tag.outputs.version }}
          generateReleaseNotes: true
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
