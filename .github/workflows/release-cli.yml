name: Release CLI

on:
  workflow_run:
    workflows: ["Build CLI"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Create GitHub release (linux)
    runs-on: ubuntu-22.04
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'gl-bws-cli-v')
    steps:
      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          if [[ ! "${TAG}" =~ ^gl-bws-cli-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected tag ${TAG}." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#gl-bws-cli-v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          api="https://api.github.com/repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts"
          resp="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}")"
          artifact_url="$(python3 - <<'PY'
import json, sys
data = json.load(sys.stdin)
for art in data.get("artifacts", []):
    if art.get("expired"):
        continue
    name = art.get("name", "")
    if name.startswith("bws-x86_64-unknown-linux-gnu-"):
        print(art["archive_download_url"])
        raise SystemExit(0)
raise SystemExit(1)
PY
<<<"${resp}")" || {
            echo "No artifacts found for run ${RUN_ID}." >&2
            echo "${resp}" >&2
            exit 1
          }
          mkdir -p packages
          curl -sS -L -H "Authorization: Bearer ${GH_TOKEN}" -o /tmp/artifact.zip "${artifact_url}"
          unzip -q /tmp/artifact.zip -d packages

      - name: Verify artifacts
        run: |
          ls -la packages
          test -f "packages/bws-x86_64-unknown-linux-gnu-${{ steps.tag.outputs.version }}.tar.gz"
          test -f "packages/bws-sha256-checksums-${{ steps.tag.outputs.version }}.txt"

      - name: Create GitHub release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          artifacts: packages/bws-x86_64-unknown-linux-gnu-${{ steps.tag.outputs.version }}.tar.gz,packages/bws-sha256-checksums-${{ steps.tag.outputs.version }}.txt
          tag: ${{ steps.tag.outputs.tag }}
          name: bws CLI v${{ steps.tag.outputs.version }}
          generateReleaseNotes: true
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
