name: Build bws-cli

on:
  push:
    tags:
      - "gl-bws-cli-v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout shared actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ vars.GH_ACTIONS_SHARED_PROJ }}
          ref: ${{ vars.GH_ACTIONS_SHARED_REF }}
          path: .github/actions/gh-actions
          fetch-depth: 1
          persist-credentials: false

      - name: Ensure tag is on mcr/release
        if: startsWith(github.ref, 'refs/tags/gl-')
        uses: ./.github/actions/gh-actions/actions/require-release-tip
        with:
          release_branch: mcr/release
          allow_merge_commits: "true"

      - name: Read package version
        id: version
        run: |
          set -euo pipefail
          version="$(python3 scripts/get_version.py get)"
          if [ -z "${version}" ]; then
            echo "Failed to read version from crates/bws/Cargo.toml" >&2
            exit 1
          fi
          echo "package_version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/gl-')
        uses: ./.github/actions/gh-actions/actions/validate-tag-version
        with:
          tag_prefix: gl-bws-cli-v
          expected_version: ${{ steps.version.outputs.package_version }}
          allow_revision_suffix: "true"

  build-linux:
    name: Build bws-cli (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: setup
    env:
      TARGET: x86_64-unknown-linux-gnu
      PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pkg-config libssl-dev

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c # v1
        with:
          target: ${{ env.TARGET }}
          cache: false
          rustflags: ""

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: ${{ env.TARGET }}-cargo-linux

      - name: Ensure Cargo.lock is synchronized
        run: |
          set -euo pipefail
          if cargo metadata \
            --manifest-path Cargo.toml \
            --locked \
            --format-version 1 >/dev/null 2>&1; then
            echo "Cargo.lock is synchronized"
          else
            echo "Cargo.lock out of sync after release mutations; regenerating"
            cargo generate-lockfile --manifest-path Cargo.toml
          fi

      - name: Build release binary
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path Cargo.toml \
            --package bws \
            --bin bws \
            --release \
            --target "${TARGET}" \
            --target-dir target \
            --locked

      - name: Pack linux tarball
        run: |
          set -euo pipefail
          bin_dir="target/${TARGET}/release"
          tarball="bws-${TARGET}-${PACKAGE_VERSION}.tar.gz"
          test -f "${bin_dir}/bws"
          tar -czf "${tarball}" -C "${bin_dir}" bws

      - name: Create checksum
        run: |
          set -euo pipefail
          sha256sum "bws-${TARGET}-${PACKAGE_VERSION}.tar.gz" \
            > "bws-sha256-checksums-${PACKAGE_VERSION}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bws-${{ env.TARGET }}-${{ env.PACKAGE_VERSION }}
          path: |
            bws-${{ env.TARGET }}-${{ env.PACKAGE_VERSION }}.tar.gz
            bws-sha256-checksums-${{ env.PACKAGE_VERSION }}.txt
          if-no-files-found: error
