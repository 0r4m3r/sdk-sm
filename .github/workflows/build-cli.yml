name: Build CLI

on:
  push:
    tags:
      - "gl-bws-cli-v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-22.04
    outputs:
      package_version: ${{ steps.retrieve-version.outputs.package_version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout shared actions
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: ${{ vars.GH_ACTIONS_SHARED_PROJ }}
          ref: ${{ vars.GH_ACTIONS_SHARED_REF }}
          path: .github/actions/gh-actions
          persist-credentials: false
          fetch-depth: 1

      - name: Ensure tag is on mcr/release
        if: startsWith(github.ref, 'refs/tags/gl-')
        uses: ./.github/actions/gh-actions/require-release-tip
        with:
          release_branch: mcr/release

      - name: Get Package Version
        id: retrieve-version
        run: |
          VERSION=$(grep -o '^version = ".*"' crates/bws/Cargo.toml | grep -Eo "[0-9]+\.[0-9]+\.[0-9]+")
          echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate gl-bws-cli-v* tag
        if: startsWith(github.ref, 'refs/tags/gl-')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "${TAG}" =~ ^gl-bws-cli-v[0-9]+\.[0-9]+\.[0-9]+(-r[0-9]+)?$ ]]; then
            exit 0
          fi
          echo "Invalid tag: ${TAG}. Expected gl-bws-cli-v<semver> (e.g. gl-bws-cli-v0.0.2 or gl-bws-cli-v0.0.2-r1)." >&2
          exit 1

      - name: Validate tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/gl-')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/gl-bws-cli-v}"
          TAG_VERSION="${TAG_VERSION%%-r*}"
          if [[ "${TAG_VERSION}" != "${{ steps.retrieve-version.outputs.package_version }}" ]]; then
            echo "Tag version ${TAG_VERSION} does not match Cargo.toml version ${{ steps.retrieve-version.outputs.package_version }}." >&2
            exit 1
          fi

  build-linux:
    name: Build bws CLI (linux)
    runs-on: ubuntu-22.04
    needs: setup
    env:
      _PACKAGE_VERSION: ${{ needs.setup.outputs.package_version }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install rust
        uses: dtolnay/rust-toolchain@0b1efabc08b657293548b77fb76cc02d26091c7e # stable
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: ${{ env.TARGET }}-cargo-linux

      - name: Build
        run: cargo build -p bws --release --target=${{ env.TARGET }}

      - name: Pack linux tarball
        run: tar -czf "./bws-${{ env.TARGET }}-${_PACKAGE_VERSION}.tar.gz" -C "./target/${{ env.TARGET }}/release" bws

      - name: Create checksum
        run: |
          sha256sum "bws-${{ env.TARGET }}-${_PACKAGE_VERSION}.tar.gz" > "bws-sha256-checksums-${_PACKAGE_VERSION}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bws-${{ env.TARGET }}-${{ env._PACKAGE_VERSION }}
          path: |
            ./bws-${{ env.TARGET }}-${{ env._PACKAGE_VERSION }}.tar.gz
            ./bws-sha256-checksums-${{ env._PACKAGE_VERSION }}.txt
          if-no-files-found: error
