name: Release bws-cli

on:
  workflow_run:
    workflows: ["Build bws-cli"]
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  resolve_tag:
    name: Resolve release tag
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release-policy tag from workflow run SHA
        id: resolve
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          tag="$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | grep -E '(^[0-9]{1,10}$|^.*[^0-9][0-9]{1,10}$)' | LC_ALL=C sort | head -n1 || true)"
          if [ -z "${tag}" ]; then
            echo "No tag with trailing 1-10 digit suffix points at workflow run SHA ${{ github.event.workflow_run.head_sha }}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  release:
    name: Create GitHub release (linux)
    needs: resolve_tag
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      needs.resolve_tag.outputs.tag != ''
    uses: mattycramer/gh-actions/.github/workflows/release-from-workflow-run.yml@4ad5d3f542f960875f7bc3b17fec77e25b62d3f6
    with:
      tag: ${{ needs.resolve_tag.outputs.tag }}
      allow_revision_suffix: true
      run_id: ${{ github.event.workflow_run.id }}
      artifact_prefix: bws-x86_64-unknown-linux-gnu-
      tarball_prefix: bws-x86_64-unknown-linux-gnu-
      checksum_prefix: bws-sha256-checksums-
      release_name: bws-cli v{version}
    secrets: inherit
