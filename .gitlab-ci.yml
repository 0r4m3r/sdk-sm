workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
    - changes:
        - "**/*.rs"
        - "**/*.toml"
        - "**/*.lock"
        - "crates/**"
        - "Cargo.toml"
        - "Cargo.lock"
        - ".gitlab-ci.yml"
        - "scripts/**"
    - when: never

stages:
  - verify
  - test
  - github-sync

include:
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/rustc/verify.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/rustc/test.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/gh-release/gh-push-validate.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/gh-release/gh-push-release.yml'

# Repo-specific overrides for this workspace
variables:
  CARGO_TEST_FLAGS: ''
  CARGO_BUILD_FLAGS: >
    
  CARGO_FMT_FLAGS: ''
  CARGO_CLIPPY_FLAGS: >
    
