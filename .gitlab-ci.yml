workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^gl-/'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "mcr/staging"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == "mcr/release"'
    - when: never

stages:
  - verify
  - test
  - github-sync
  - gitlab-release
  - gitlab-cleanup

include:
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/rustc/verify.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/rustc/test.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/github/validate.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/github/push.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/gitlab/validate.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/gitlab/release.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/rustc/release-build.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/gitlab/cleanup.yml'

# Repo-specific overrides for bws-cli release delivery
variables:
  GH_RELEASE_PUSH: "true"
  GH_FORCE_PUSH: "false"
  GH_PUBLIC_REPO: "true"
  GL_RELEASE_ASSET: "true"
  GL_CLEAR_GLAB: "false"
  APPEND_VERSION: "true"
  RELEASE_VERSION: '2.0.0'
  APPLY_PATCHES: "false"
  APPLY_PATCHES_EXCLUDE: ""
  # Set GL_CICD_RUNNER_RELEASE as a CI/CD variable to a pinned glab image digest.
  GL_CICD_RUNNER_BUILD: '${GL_CICD_RUNNER_RUST}'
  GL_RELEASE_TARGET: "x86_64-unknown-linux-gnu"
  GL_RELEASE_CARGO_MANIFEST: "Cargo.toml"
  GL_RELEASE_ARTIFACT_PREFIX: "bws"
  GL_RELEASE_PACKAGE_NAME: "bws-cli"
  GL_RELEASE_CARGO_EXCLUDES: "bitwarden bitwarden-c bitwarden-json bitwarden-napi bitwarden-py bitwarden-wasm fake-server sdk-schemas"
  RELEASE_BINS: |
    bws
  CARGO_TEST_FLAGS: '--manifest-path Cargo.toml -p bws --bin bws'
  CARGO_BUILD_FLAGS: '--manifest-path Cargo.toml -p bws'
  CARGO_FMT_FLAGS: '--manifest-path Cargo.toml -p bws --check'
  CARGO_CLIPPY_FLAGS: '--manifest-path Cargo.toml -p bws --bin bws -- -D warnings'
